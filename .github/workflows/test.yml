name: "Tests Delivra"

on:
  workflow_dispatch:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Suite de tests
        run: python -m unittest discover -s tests -v

      - name: Vérifier la couverture des ressources empaquetées
        run: python tools/check_frozen_data.py
