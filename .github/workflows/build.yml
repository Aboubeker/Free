name: "Build Delivra"

# Produit les exécutables autonomes :
#   • Windows  → dist/Delivra/Delivra.exe  (+ archive zip)
#   • Linux    → dist/Delivra/Delivra
#   • macOS    → dist/Delivra.app
# Déclenchement manuel ou à chaque tag « v* ».

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 4 1 * *"   # reconstruction mensuelle (fraîcheur des dépendances)

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Delivra-windows-x64
            archive: Delivra-windows-x64.zip
          - os: ubuntu-latest
            artifact: Delivra-linux-x64
            archive: Delivra-linux-x64.tar.gz
          - os: macos-latest
            artifact: Delivra-macos-arm64
            archive: Delivra-macos-arm64.zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Générer l'icône
        run: python packaging/make_icon.py

      - name: Construire l'exécutable
        run: pyinstaller delivra.spec --noconfirm --clean

      - name: Vérifier le démarrage (smoke test)
        run: python tools/smoke_frozen.py

      - name: Archiver (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Delivra/* -DestinationPath ${{ matrix.archive }}

      - name: Archiver (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.archive }} -C dist Delivra

      - name: Archiver (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist && zip -r ../${{ matrix.archive }} Delivra

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          retention-days: 30

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
          generate_release_notes: true
